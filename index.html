<style>
/* Layout: one narrow column, summary on top, vertical trail timeline, thumb-reach action bar fixed at the bottom.
   Fonts are system faces on purpose: the app must render identically with no network. */
:root{
  --bg:#e9eeeb; --surface:#ffffff; --sunk:#dfe6e2; --ink:#16201b; --muted:#5a6760; --line:#cdd6d1;
  --accent:#d94a14; --accent-ink:#ffffff; --walk:#2c6a4c; --rest:#355a85; --warn:#b42318;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:14px; --fz:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#171f1b; --sunk:#111815; --ink:#e4ebe7; --muted:#8f9d96; --line:#283330;
  --accent:#ff6a2b; --accent-ink:#1a0d06; --walk:#6cc298; --rest:#8fb2de; --warn:#ff8a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#171f1b; --sunk:#111815; --ink:#e4ebe7; --muted:#8f9d96; --line:#283330;
  --accent:#ff6a2b; --accent-ink:#1a0d06; --walk:#6cc298; --rest:#8fb2de; --warn:#ff8a7a; color-scheme:dark}
/* night-vision red: every token is a dim red on black, overriding any theme */
:root.night,:root.night[data-theme]{
  --bg:#000; --surface:#0c0000; --sunk:#060000; --ink:#d23030; --muted:#8a2222; --line:#360808;
  --accent:#6e0e0e; --accent-ink:#ff5c5c; --walk:#e04848; --rest:#9c2e2e; --warn:#ff6a6a; color-scheme:dark}
:root.large{--fz:1.25}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(16px*var(--fz));line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--rest)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 240px}
.app.noaction{padding-block-end:48px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:8px;padding-block:10px;min-height:56px}
.top h1{flex:1;min-width:0;margin:0;font-size:calc(20px*var(--fz));font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{min-width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:15px;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:0 12px;white-space:nowrap}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}

/* list */
.newtrip{width:100%;height:64px;border-radius:var(--r);background:var(--ink);color:var(--bg);font-size:calc(18px*var(--fz));font-weight:700;margin-block:6px 18px}
.trips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:76px}
.trip-name{font-weight:700;font-size:calc(17px*var(--fz));min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-meta{grid-column:1;color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trip-dur{grid-row:1/3;grid-column:2;text-align:right;font-size:calc(22px*var(--fz))}
.trip-dur small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.06em}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.live{border-color:var(--accent);color:var(--accent);font-weight:700}
:root.night .pill.live{color:var(--ink);border-color:var(--ink)}
.tools{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.tools .iconbtn{flex:1}
.empty{color:var(--muted);text-align:center;padding:36px 8px;border:1px dashed var(--line);border-radius:var(--r)}

/* summary */
.status{display:flex;align-items:center;gap:10px;font-size:calc(15px*var(--fz));margin-block:2px 10px;min-height:28px}
.status .dotlive{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s infinite}
:root.night .status .dotlive{background:var(--ink)}
.status.rest .dotlive{background:var(--rest)}
.status.done .dotlive{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status .dotlive{animation:none}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-size:calc(30px*var(--fz));font-weight:600;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.walk b{color:var(--walk)} .stat.rest b{color:var(--rest)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-top:10px}
.bar i{display:block;height:100%} .bar .w{background:var(--walk)} .bar .r{background:var(--rest)}

/* timeline */
.tl{list-style:none;margin:20px 0 0;padding:0 0 0 22px;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;background:var(--line)}
.stop{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px}
.stop::before{content:"";position:absolute;left:-21px;top:20px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:3px solid var(--walk)}
.stop.now{border-color:var(--rest)} .stop.now::before{border-color:var(--rest);background:var(--rest)}
.stop.first::before,.stop.last::before{border-radius:3px}
.stop-name{font-weight:700;font-size:calc(17px*var(--fz));overflow-wrap:anywhere}
.stop-name.unnamed{color:var(--muted);font-weight:500}
.stop-note{grid-column:1;font-size:calc(13px*var(--fz));color:var(--muted);overflow-wrap:anywhere}
.stop-times{grid-row:1/3;grid-column:2;text-align:right;font-size:calc(14px*var(--fz));line-height:1.5}
.stop-times .k{font-family:var(--sans);font-size:11px;color:var(--muted);margin-right:4px}
.stop-rest{grid-column:1/3;display:flex;gap:10px;align-items:center;font-size:calc(13px*var(--fz));color:var(--rest)}
.stop-rest .num{font-weight:600}
.meta{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;align-items:center}
.tag{padding:2px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);color:var(--ink)}
.tag.danger{color:var(--warn);border-color:var(--warn)}
.tag.cond{color:var(--muted)}
.tag.cond.bad{color:var(--warn)}
.warn{color:var(--warn);font-weight:700}
.leg{display:flex;align-items:center;gap:8px;padding:8px 0 8px 4px;font-size:calc(13px*var(--fz));color:var(--walk)}
.leg .num{font-weight:600;font-size:calc(14px*var(--fz))}
.leg .cum{margin-left:auto;color:var(--muted)}
.markli{padding:2px 0 6px}
.mark{position:relative;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;padding:8px 12px;
  border-radius:10px;border:1px dashed var(--line);font-size:calc(14px*var(--fz));min-height:44px}
.mark::before{content:"";position:absolute;left:-19px;top:50%;width:8px;height:8px;margin-top:-4px;transform:rotate(45deg);background:var(--muted)}
.mark b{font-weight:700} .mark.danger b{color:var(--warn)}
.mark .num{color:var(--muted)}

/* action bar */
.action{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.action-in{max-width:640px;margin:0 auto;display:grid;gap:10px}
.big{width:100%;min-height:calc(84px*var(--fz));border-radius:18px;font-size:calc(24px*var(--fz));font-weight:800;letter-spacing:.04em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.big:active{transform:translateY(1px)}
.big.depart{background:var(--rest);color:var(--surface)}
:root.night .big.depart{color:#ff5c5c}
.big small{font-family:var(--mono);font-size:14px;font-weight:500;opacity:.9;letter-spacing:0}
.subrow{display:flex;gap:10px}
.ghost{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:calc(15px*var(--fz))}
.ghost.danger{color:var(--warn)}
.ghost.armed{background:var(--warn);color:var(--surface);border-color:var(--warn)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;box-sizing:border-box;
  padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-size:calc(19px*var(--fz))}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;box-sizing:border-box;min-height:50px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);padding:10px 12px;font-size:calc(17px*var(--fz))}
.field textarea{min-height:76px;resize:vertical}
.timefield{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.timefield input{min-width:0}
.mini{min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:calc(15px*var(--fz))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.primary{min-height:54px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:calc(17px*var(--fz))}
.hint{font-size:13px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tagbtn{min-height:calc(68px*var(--fz));border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:calc(18px*var(--fz));font-weight:700}
.tagbtn.danger{color:var(--warn)}
.geo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.toggle span{font-size:calc(16px*var(--fz))} .toggle small{display:block;font-size:12px;color:var(--muted)}

/* report & stats */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sec{margin:24px 0 8px;font-size:14px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kv b{display:block;font-size:calc(22px*var(--fz));font-weight:600}
.kv span{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.rep{border-collapse:collapse;width:100%;font-size:calc(14px*var(--fz));min-width:520px}
.rep th,.rep td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.rep th:first-child,.rep td:first-child{text-align:left;white-space:normal;min-width:140px}
.rep th{font-size:12px;color:var(--muted);font-weight:600}
.rep tr:last-child td{border-bottom:0}
.rep .sub{display:block;font-size:12px;color:var(--muted)}
.slow{color:var(--warn)} .fast{color:var(--walk)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.peaks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.peaks li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.peaks b{display:block} .peaks span{font-size:12px;color:var(--muted)}
.peakbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin:14px 0 4px}
.grp{display:flex;justify-content:space-between;margin:18px 0 8px;font-size:calc(15px*var(--fz))}
.grp .num{color:var(--muted);font-weight:500}
.peaklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.peak{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;
  padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.peak.done{background:var(--surface);color:var(--ink);border-color:var(--walk)}
.pk-rank{font-size:13px;text-align:right}
.peak.done .pk-rank{color:var(--walk);font-weight:700}
.pk-main b{display:block;font-size:calc(16px*var(--fz));font-weight:600}
.peak:not(.done) .pk-main b{font-weight:500}
.pk-main span{font-size:12px}
.pk-st{text-align:right;font-size:13px}
.pk-st small{display:block;font-size:12px;color:var(--muted)}
.peak.done .pk-st .num{color:var(--walk);font-weight:600}
.progress{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--walk)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btnrow .ghost{min-width:140px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:50;
  width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;
  display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast p{flex:1;margin:0;font-size:15px}
.toast button{min-height:42px;padding:0 12px;border-radius:10px;color:var(--bg);border:1px solid var(--bg);font-size:14px}
</style>
</head><body>

/* ---------- helpers ---------- */
function fmtDur(ms){if(ms==null||isNaN(ms))return '—';const neg=ms<0;let m=Math.round(Math.abs(ms)/60000);return (neg?'-':'')+Math.floor(m/60)+':'+pad(m%60)}
function fmtDiff(ms){if(ms==null)return '—';const m=Math.round(ms/60000);if(m===0)return '±0';return (m>0?'+':'−')+fmtDur(Math.abs(ms))}
function dayIndex(ts,base){const a=new Date(ts);a.setHours(0,0,0,0);const b=new Date(base);b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function fmtTime(ts,base){if(ts==null)return '—';const d=new Date(ts);const t=pad(d.getHours())+':'+pad(d.getMinutes());
  if(base!=null){const k=dayIndex(ts,base);if(k!==0)return 'D'+(k+1)+' '+t}return t}
function fmtDate(ts){const d=new Date(ts);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())}
function fmtFull(ts){if(ts==null)return '';const d=new Date(ts);return fmtDate(ts).replace(/\//g,'-')+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function toInput(ts){if(ts==null)return '';const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function fromInput(v){if(!v)return null;const t=new Date(v).getTime();return isNaN(t)?null:t}
const mins=ms=>ms==null?'':Math.round(ms/60000);
const isExample=t=>/^範例/.test(t.name);
function haversine(a,b){if(a.lat==null||b.lat==null||a.lon==null||b.lon==null)return null;const R=6371,r=x=>x*Math.PI/180;
  const dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- core calculation ---------- */
function calc(t,now){
  const S=t.stations, active=!t.ended&&S.length>0;
  const out={rows:[],elapsed:0,rest:0,walk:0,start:null,active,state:'idle',up:0,down:0,dist:0,hasAlt:false,hasDist:false};
  if(!S.length)return out;
  const start=S[0].dep??S[0].arr; out.start=start;
  let last=start??0;
  S.forEach((s,i)=>{
    const r={rest:null,leg:null,ongoing:false,warn:false,cum:null,up:null,down:null,dist:null};
    if(s.arr!=null&&s.dep!=null){r.rest=s.dep-s.arr;if(r.rest<0)r.warn=true}
    if(i>0){const p=S[i-1];
      if(p.dep!=null&&s.arr!=null){r.leg=s.arr-p.dep;if(r.leg<0)r.warn=true}
      if(p.alt!=null&&s.alt!=null){const dz=s.alt-p.alt;r.up=Math.max(0,dz);r.down=Math.max(0,-dz);out.up+=r.up;out.down+=r.down;out.hasAlt=true}
      const km=haversine(p,s);if(km!=null){r.dist=km;out.dist+=km;out.hasDist=true}}
    if(i===S.length-1&&active&&s.arr!=null&&s.dep==null){r.rest=Math.max(0,now-s.arr);r.ongoing=true}
    if(s.arr!=null&&start!=null)r.cum=s.arr-start;
    [s.arr,s.dep].forEach(v=>{if(v!=null&&v>last)last=v});
    if(r.rest>0)out.rest+=r.rest;
    out.rows.push(r);
  });
  const end=active?Math.max(now,last):last;
  out.end=end;
  out.elapsed=start!=null?Math.max(0,end-start):0;
  out.walk=Math.max(0,out.elapsed-out.rest);
  const l=S[S.length-1];
  out.state=t.ended?'done':(l.arr!=null&&l.dep==null)?'rest':'walk';
  return out;
}
function nextAction(t){if(t.ended)return null;const S=t.stations;if(!S.length)return 'start';const l=S[S.length-1];return (l.arr!=null&&l.dep==null)?'depart':'arrive'}
const trip=()=>db.trips.find(x=>x.id===view.id);

/* leg comparison between trips that share station names */
const legKey=(a,b)=>a.trim()+'→'+b.trim();
function legMap(t){const m=new Map(),c=calc(t,Date.now());t.stations.forEach((s,i)=>{if(i&&c.rows[i].leg!=null){const k=legKey(t.stations[i-1].name,s.name);if(!m.has(k))m.set(k,c.rows[i].leg)}});return m}
function compareCandidates(t){const mine=legMap(t);return db.trips.filter(o=>o.id!==t.id&&o.stations.length>1).map(o=>{const om=legMap(o);let n=0;mine.forEach((_,k)=>{if(om.has(k))n++});return {t:o,n,start:calc(o,Date.now()).start||o.created}}).filter(x=>x.n>0).sort((a,b)=>b.start-a.start)}

function stationMeta(s){
  const bits=[];
  (s.tags||[]).forEach(g=>bits.push(`<span class="tag ${DANGER.has(g)?'danger':''}">${esc(g)}</span>`));
  if(s.weather)bits.push(`<span class="tag cond">${esc(s.weather)}</span>`);
  if(s.team)bits.push(`<span class="tag cond ${s.team==='差'?'bad':''}">體力 ${esc(s.team)}</span>`);
  if(s.alt!=null)bits.push(`<span class="num" style="color:var(--muted)">${s.alt}m</span>`);
  else if(s.lat!=null)bits.push(`<span style="color:var(--muted)">已定位</span>`);
  return bits.length?`<span class="meta">${bits.join('')}</span>`:'';
}
function markRow(m,base){return `<li class="markli"><button class="mark ${DANGER.has(m.tag)?'danger':''}" data-act="editmark" data-id="${m.id}">
  <b>${esc(m.tag)}</b><span class="num">${fmtTime(m.ts,base)}</span>${m.note?`<span>${esc(m.note)}</span>`:''}</button></li>`}

function renderTrip(){
  const t=trip(); if(!t)return renderList();
  const now=Date.now(), c=calc(t,now), S=t.stations;
  let statusText='尚未出發', cls='';
  if(c.state==='walk'){const l=S[S.length-1];statusText=`行走中 · 離開 ${esc(l.name)} <span class="num">${fmtDur(now-(l.dep??l.arr))}</span>`}
  if(c.state==='rest'){const l=S[S.length-1];cls='rest';statusText=`休息中 · ${esc(l.name)} <span class="num">${fmtDur(now-l.arr)}</span>`}
  if(c.state==='done'){cls='done';statusText=`已結束 · ${fmtDate(c.start??t.created)}`}
  const tot=c.walk+c.rest||1;
  const marks=[...t.marks].sort((a,b)=>a.ts-b.ts); let mi=0;
  const flushMarks=lim=>{let h='';while(mi<marks.length&&(lim==null||marks[mi].ts<lim)){h+=markRow(marks[mi],c.start);mi++}return h};
  let rows='';
  S.forEach((s,i)=>{
    const r=c.rows[i], ref=s.arr??s.dep;
    if(i>0)rows+=`<li class="leg"><span>行走</span><span class="num ${r.leg!=null&&r.leg<0?'warn':''}">${fmtDur(r.leg)}</span>${r.cum!=null?`<span class="cum">累積 <span class="num">${fmtDur(r.cum)}</span></span>`:''}</li>`;
    rows+=flushMarks(ref);
    const unnamed=/^第\d+站$/.test(s.name);
    const showRest=r.rest!=null&&(r.ongoing||r.warn||Math.round(r.rest/60000)!==0);
    rows+=`<li><button class="stop ${i===0?'first':''} ${i===S.length-1&&t.ended?'last':''} ${r.ongoing?'now':''}" data-act="edit" data-i="${i}">
      <span class="stop-name ${unnamed?'unnamed':''}">${esc(s.name)}${unnamed?'（點此命名）':''}</span>
      <span class="stop-times num">${s.arr!=null?`<div><span class="k">抵</span>${fmtTime(s.arr,c.start)}</div>`:''}${s.dep!=null?`<div><span class="k">離</span>${fmtTime(s.dep,c.start)}</div>`:''}</span>
      ${s.note?`<span class="stop-note">${esc(s.note)}</span>`:''}
      ${stationMeta(s)}
      ${showRest?`<span class="stop-rest">${r.ongoing?'休息中':'休息'} <span class="num ${r.warn?'warn':''}">${fmtDur(r.rest)}</span>${r.warn?'<span class="warn">時間順序有誤</span>':''}</span>`:''}
    </button></li>`;
  });
  rows+=flushMarks(null);
  $('#app').className='app';
  $('#app').innerHTML=`
    <header class="top"><button class="iconbtn" data-act="back" aria-label="回行程列表">‹</button>
      <h1>${esc(t.name)}</h1><button class="iconbtn" data-act="display" aria-label="顯示設定">Aa</button><button class="iconbtn" data-act="tripmenu" aria-label="行程設定">⋯</button></header>
    <div class="status ${cls}"><span class="dotlive"></span><span>${statusText}</span></div>
    <section class="stats" aria-label="時間統計">
      <div class="stat"><b class="num">${fmtDur(c.elapsed)}</b><span>累積經過</span></div>
      <div class="stat walk"><b class="num">${fmtDur(c.walk)}</b><span>實際行走</span></div>
      <div class="stat rest"><b class="num">${fmtDur(c.rest)}</b><span>累積休息</span></div>
      <div class="stat"><b class="num">${S.filter(s=>s.arr!=null).length}</b><span>抵達站數</span></div>
    </section>
    <div class="bar" aria-hidden="true"><i class="w" style="width:${c.walk/tot*100}%"></i><i class="r" style="width:${c.rest/tot*100}%"></i></div>
    ${S.length||marks.length?`<ol class="tl">${rows}</ol>`:`<p class="empty" style="margin-top:20px">在登山口按下「記錄出發」，就會開始計時。</p>`}
    ${t.note?`<p class="hint" style="margin-top:16px">${esc(t.note)}</p>`:''}
    ${S.length>1?`<div class="btnrow"><button class="ghost" data-act="report">查看行程報告</button></div>`:''}`;
  renderAction(t);
}

function renderAction(t){

/* ---------- GPS: one fix per tap, never continuous ---------- */
function grabGeo(tripId,kind,id,quiet){
  if(!settings.gps||!navigator.geolocation)return;
  try{navigator.geolocation.getCurrentPosition(p=>{
    const t=db.trips.find(x=>x.id===tripId);if(!t)return;
    const o=(kind==='mark'?t.marks:t.stations).find(x=>x.id===id);if(!o)return;
    o.lat=+p.coords.latitude.toFixed(6);o.lon=+p.coords.longitude.toFixed(6);o.acc=Math.round(p.coords.accuracy);
    if(p.coords.altitude!=null&&(o.alt==null||!quiet))o.alt=Math.round(p.coords.altitude);
    save();
    if(!$('#sheethost').innerHTML&&view.name==='trip'){const y=window.scrollY;renderTrip();window.scrollTo(0,y)}
    else if(!quiet)showToast('已更新位置（誤差約 '+o.acc+' m）');
  },err=>{
    if(err.code===1&&!geoDeniedShown){geoDeniedShown=true;showToast('未允許定位：時間照常記錄。可在「Aa」關閉記錄位置')}
    else if(!quiet)showToast('定位失敗，請到開闊處再試')
  },{enableHighAccuracy:true,timeout:30000,maximumAge:20000})}catch(e){}
}

/* ---------- actions ---------- */
function snapshot(t){return JSON.stringify(t)}
function restoreSnap(s){const o=JSON.parse(s);const i=db.trips.findIndex(x=>x.id===o.id);if(i>=0)db.trips[i]=o;save();render()}
const undoBtn=snap=>({label:'復原',fn:()=>{restoreSnap(snap);showToast('已復原')}});
function vibrate(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}

function record(kind){
  const t=trip(); if(!t)return;
  const snap=snapshot(t), now=Date.now(), S=t.stations;
  let target;
  if(kind==='start'){target={id:uid(),name:'登山口',note:'',arr:null,dep:now,tags:[]};S.push(target)}
  if(kind==='arrive'){target={id:uid(),name:'第'+S.length+'站',note:'',arr:now,dep:null,tags:[]};S.push(target)}
  if(kind==='depart'){target=S[S.length-1];target.dep=now}
  save(); render(); vibrate();
  if(kind!=='depart'||target.lat==null)grabGeo(t.id,'station',target.id,true);
  const idx=S.length-1;
  const msg={start:'已記錄出發',arrive:'已記錄抵達',depart:'已記錄離開'}[kind]+' '+fmtTime(now);
  showToast(msg,[...(kind!=='depart'?[{label:'命名',fn:()=>openStation(idx)}]:[]),undoBtn(snap)]);
}
function addMark(tag){
  const t=trip(); const snap=snapshot(t), now=Date.now();
  const m={id:uid(),tag,ts:now,note:''}; t.marks.push(m);
  save(); closeSheet(); render(); vibrate();
  grabGeo(t.id,'mark',m.id,true);
  showToast('已標記 '+tag+' '+fmtTime(now),[{label:'備註',fn:()=>openMark(m.id)},undoBtn(snap)]);
}
function endTrip(){
  const t=trip(); const snap=snapshot(t), now=Date.now(), S=t.stations, l=S[S.length-1];
  if(l.dep!=null){const s={id:uid(),name:'終點',note:'',arr:now,dep:null,tags:[]};S.push(s);grabGeo(t.id,'station',s.id,true)}
  t.ended=Math.max(now,l.arr||0); save(); render();
  showToast('行程已結束',[{label:'看報告',fn:()=>go({name:'report',id:t.id})},undoBtn(snap)]);
}

/* ---------- report ---------- */
function reportData(t){
  const c=calc(t,Date.now()), S=t.stations;
  const legs=S.map((s,i)=>{if(!i)return null;const r=c.rows[i];const h=r.leg!=null&&r.leg>0?r.leg/36e5:null;
    return {from:S[i-1],to:s,r,vUp:h&&r.up?Math.round(r.up/h):null,vDown:h&&r.down?Math.round(r.down/h):null,kmh:h&&r.dist!=null?r.dist/h:null}}).filter(Boolean);
  return {c,legs};
}
function renderReport(){
  const t=trip(); const {c,legs}=reportData(t);
  const restPct=c.elapsed?Math.round(c.rest/c.elapsed*100):0;
  const days=c.start!=null?dayIndex(c.end,c.start)+1:1;
  const cands=compareCandidates(t);
  let other=cands.find(x=>x.t.id===cmpChoice[t.id])||cands.find(x=>x.start<(c.start||Infinity))||cands[0];
  let cmpHtml='';
  if(other){
    const om=legMap(other.t); let sumA=0,sumB=0;
    const rowsC=legs.filter(l=>l.r.leg!=null&&om.has(legKey(l.from.name,l.to.name))).map(l=>{const b=om.get(legKey(l.from.name,l.to.name)),d=l.r.leg-b;sumA+=l.r.leg;sumB+=b;
      return `<tr><td>${esc(l.from.name)} → ${esc(l.to.name)}</td><td class="num">${fmtDur(l.r.leg)}</td><td class="num">${fmtDur(b)}</td><td class="num ${d>60000?'slow':d<-60000?'fast':''}">${fmtDiff(d)}</td></tr>`}).join('');
    cmpHtml=`<h3 class="sec">路段比較</h3>
      ${cands.length>1?`<div class="field" style="margin-bottom:10px"><label for="f-cmp">比較對象</label><select id="f-cmp" data-act="cmp">${cands.map(x=>`<option value="${x.t.id}" ${x.t.id===other.t.id?'selected':''}>${esc(x.t.name)}（${fmtDate(x.start)}，${x.n} 段相同）</option>`).join('')}</select></div>`
        :`<p class="hint" style="margin-bottom:10px">對照：${esc(other.t.name)}（${fmtDate(other.start)}）</p>`}
      <div class="scroll"><table class="rep"><thead><tr><th>相同路段</th><th>本次</th><th>上次</th><th>差距</th></tr></thead><tbody>${rowsC}
      <tr><td><b>合計</b></td><td class="num"><b>${fmtDur(sumA)}</b></td><td class="num"><b>${fmtDur(sumB)}</b></td><td class="num ${sumA-sumB>60000?'slow':sumA-sumB<-60000?'fast':''}"><b>${fmtDiff(sumA-sumB)}</b></td></tr></tbody></table></div>
      <p class="hint" style="margin-top:8px">站名相同的路段才會比較。紅色表示比上次慢，綠色表示比上次快。</p>`;
  }
  const notes=t.stations.filter(s=>s.note||s.weather||s.team||(s.tags&&s.tags.length)).map(s=>`<li><b>${esc(s.name)}</b> <span class="num" style="color:var(--muted)">${fmtTime(s.arr??s.dep,c.start)}</span><br>${[s.weather&&('天氣 '+s.weather),s.team&&('體力 '+s.team),(s.tags||[]).join('、'),s.note].filter(Boolean).map(esc).join('｜')}</li>`);
  const mk=[...t.marks].sort((a,b)=>a.ts-b.ts).map(m=>`<li><b class="${DANGER.has(m.tag)?'warn':''}">${esc(m.tag)}</b> <span class="num" style="color:var(--muted)">${fmtTime(m.ts,c.start)}</span>${m.alt!=null?` <span class="num" style="color:var(--muted)">${m.alt}m</span>`:''}${m.note?'｜'+esc(m.note):''}</li>`);
  $('#app').className='app noaction';
  $('#app').innerHTML=`
    <header class="top"><button class="iconbtn" data-act="backtrip" aria-label="回行程">‹</button><h1>行程報告</h1></header>
    <div class="card">
      <div style="font-weight:700;font-size:calc(18px*var(--fz))">${esc(t.name)}</div>
      <p class="hint" style="margin:4px 0 14px">${esc(t.type||'')}｜${c.start?fmtDate(c.start):''}${days>1?'，'+days+' 天':''}｜${t.stations.length} 站</p>
      <div class="kv">
        <div><b class="num">${fmtDur(c.elapsed)}</b><span>累積經過</span></div>
        <div><b class="num" style="color:var(--walk)">${fmtDur(c.walk)}</b><span>實際行走</span></div>
        <div><b class="num" style="color:var(--rest)">${fmtDur(c.rest)}</b><span>累積休息（${restPct}%）</span></div>
        ${c.hasAlt?`<div><b class="num">↑${c.up} ↓${c.down}</b><span>爬升／下降 m（依各站海拔）</span></div>`:''}
        ${c.hasDist?`<div><b class="num">${c.dist.toFixed(1)}</b><span>站間直線距離 km</span></div>`:''}
      </div>
      <div class="bar" aria-hidden="true"><i class="w" style="width:${100-restPct}%"></i><i class="r" style="width:${restPct}%"></i></div>
    </div>
    <h3 class="sec">各段行走</h3>
    <div class="scroll"><table class="rep"><thead><tr><th>路段</th><th>行走</th><th>爬升／下降</th><th>垂直速度</th><th>到站休息</th></tr></thead><tbody>
      ${legs.map(l=>`<tr><td>${esc(l.from.name)} → ${esc(l.to.name)}<span class="sub num">${fmtTime(l.from.dep,c.start)} – ${fmtTime(l.to.arr,c.start)}</span></td>
        <td class="num">${fmtDur(l.r.leg)}</td>
        <td class="num">${l.r.up!=null?`↑${l.r.up} ↓${l.r.down}`:'—'}</td>
        <td class="num">${l.vUp?`↑${l.vUp} m/h`:l.vDown?`↓${l.vDown} m/h`:'—'}</td>
        <td class="num">${l.r.rest!=null&&!l.r.ongoing?fmtDur(l.r.rest):'—'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="hint" style="margin-top:8px">垂直速度＝該段爬升（或下降）÷ 行走時間。直線距離由座標算出，會比實際步道短。和計畫時間的差距，會在加入「計畫時間」功能後顯示在這裡。</p>
    ${cmpHtml}
    ${notes.length?`<h3 class="sec">沿途狀況</h3><ul class="notes">${notes.join('')}</ul>`:''}
    ${mk.length?`<h3 class="sec">標記</h3><ul class="notes">${mk.join('')}</ul>`:''}
    <div class="btnrow"><button class="ghost" data-act="sharereport">分享報告文字</button><button class="ghost" data-act="csvfile">分享／下載 CSV</button><button class="ghost" data-act="csvcopy">複製表格</button></div>`;
  $('#actionbar').innerHTML='';
}
function reportText(t){
  const {c,legs}=reportData(t);const restPct=c.elapsed?Math.round(c.rest/c.elapsed*100):0;
  const L=[`【行程報告】${t.name}${t.type?'（'+t.type+'）':''}`,c.start?fmtDate(c.start):'',
    `累積經過 ${fmtDur(c.elapsed)}｜行走 ${fmtDur(c.walk)}｜休息 ${fmtDur(c.rest)}（${restPct}%）`];
  if(c.hasAlt)L.push(`爬升 ${c.up} m｜下降 ${c.down} m`);
  L.push('');
  t.stations.forEach((s,i)=>{const r=c.rows[i];
    if(i)L.push(`  ↓ 行走 ${fmtDur(r.leg)}${r.up!=null?`（↑${r.up} ↓${r.down}）`:''}`);
    const ex=[s.weather,s.team&&('體力'+s.team),...(s.tags||[])].filter(Boolean).join('、');
    L.push(`${fmtTime(s.arr??s.dep,c.start)} ${s.name}${s.alt!=null?' '+s.alt+'m':''}${r.rest&&!r.ongoing&&Math.round(r.rest/6e4)?'｜休息 '+fmtDur(r.rest):''}${ex?'｜'+ex:''}${s.note?'｜'+s.note:''}`)});
  if(t.marks.length){L.push('','標記：');[...t.marks].sort((a,b)=>a.ts-b.ts).forEach(m=>L.push(`${fmtTime(m.ts,c.start)} ${m.tag}${m.note?'｜'+m.note:''}`))}
  return L.join('\n');
}

/* ---------- personal stats ---------- */
function renderStats(){
  const now=Date.now(), real=db.trips.filter(t=>!isExample(t)&&t.stations.length);
  const done=real.filter(t=>t.ended);
  let el=0,wk=0,rs=0,up=0,st=0;
  done.forEach(t=>{const c=calc(t,now);el+=c.elapsed;wk+=c.walk;rs+=c.rest;up+=c.up;st+=t.stations.filter(s=>s.arr!=null).length});
  const byType={};done.forEach(t=>{byType[t.type||'其他']=(byType[t.type||'其他']||0)+1});
  const years={};done.forEach(t=>{const y=new Date(calc(t,now).start||t.created).getFullYear();years[y]=(years[y]||0)+1});
  $('#app').className='app noaction';
  $('#app').innerHTML=`

    ${!real.length?`<p class="empty">還沒有自己的行程紀錄。範例行程不列入統計。</p>`:''}

      <div><b class="num">${done.length}</b><span>完成行程</span></div>
      <div><b class="num">${fmtDur(el)}</b><span>累積經過時數</span></div>
      <div><b class="num" style="color:var(--walk)">${fmtDur(wk)}</b><span>累積行走</span></div>
      <div><b class="num" style="color:var(--rest)">${fmtDur(rs)}</b><span>累積休息</span></div>
      <div><b class="num">${st}</b><span>抵達站數</span></div>
      ${up?`<div><b class="num">${up.toLocaleString()}</b><span>累積爬升 m</span></div>`:''}
    </div></div>
    ${Object.keys(byType).length?`<h3 class="sec">依類型</h3><div class="card"><div class="kv">${Object.entries(byType).map(([k,v])=>`<div><b class="num">${v}</b><span>${esc(k)}</span></div>`).join('')}</div></div>`:''}
    ${Object.keys(years).length>1?`<h3 class="sec">依年度</h3><div class="card"><div class="kv">${Object.entries(years).sort().map(([k,v])=>`<div><b class="num">${v}</b><span>${k} 年</span></div>`).join('')}</div></div>`:''}
    ${peaksSection()}`;
  $('#actionbar').innerHTML='';
}

/* ---------- 百岳 ---------- */
function peakClimbs(){
  const m=new Map();PEAKS.forEach(p=>m.set(p[0],[]));const extra=new Map();
  db.trips.filter(t=>!isExample(t)).forEach(t=>t.stations.forEach(s=>{if(!(s.tags||[]).includes('百岳'))return;
    const ts=s.arr??s.dep??t.created, pk=peakOf(s.name), rec={ts,trip:t,station:s};
    if(pk)m.get(pk[0]).push(rec);else{const k=s.name.trim();if(!extra.has(k))extra.set(k,[]);extra.get(k).push(rec)}}));
  db.peaksManual.forEach(x=>{if(m.has(x.rank))m.get(x.rank).push({ts:x.ts,manual:x})});
  m.forEach(v=>v.sort((a,b)=>a.ts-b.ts));
  return {m,extra};
}
function peaksSection(){
  const {m,extra}=peakClimbs();const done=PEAKS.filter(p=>m.get(p[0]).length);
  const show=PEAKS.filter(p=>peakFilter==='all'||(peakFilter==='done')===(m.get(p[0]).length>0));
  const item=p=>{const c=m.get(p[0]),ok=c.length>0;return `<li><button class="peak ${ok?'done':''}" data-act="peak" data-rank="${p[0]}">
    <span class="pk-rank num">${p[0]}</span><span class="pk-main"><b>${p[1]}</b><span class="num">${p[2]} m</span></span>
    <span class="pk-st">${ok?`<span class="num">${fmtDate(c[0].ts)}</span>${c.length>1?`<small>${c.length} 次</small>`:''}`:'<small>未登</small>'}</span></button></li>`};
  let body='';
  if(peakGroup==='route'){const groups=[];show.forEach(p=>{let g=groups.find(x=>x.k===p[3]);if(!g){g={k:p[3],items:[]};groups.push(g)}g.items.push(p)});
    groups.sort((a,b)=>Math.min(...a.items.map(x=>x[0]))-Math.min(...b.items.map(x=>x[0])));
    body=groups.map(g=>{const all=PEAKS.filter(p=>p[3]===g.k),n=all.filter(p=>m.get(p[0]).length).length;
      return `<h4 class="grp">${g.k}<span class="num">${n} / ${all.length}</span></h4><ul class="peaklist">${g.items.map(item).join('')}</ul>`}).join('');}
  else body=`<ul class="peaklist">${show.map(item).join('')}</ul>`;
  return `<h3 class="sec">百岳完成清單</h3>
    <div class="card"><b class="num" style="font-size:calc(26px*var(--fz))">${done.length}</b> <span class="hint" style="display:inline">/ 100 座</span>
      ${done.length?`<span class="hint" style="display:inline">｜最高 ${done[0][1]} ${done[0][2]} m</span>`:''}
      <div class="progress"><i style="width:${done.length}%"></i></div></div>
    <div class="peakbar">
      <div class="chips">${[['all','全部'],['done','已登'],['todo','未登']].map(([k,l])=>`<button class="chip" data-act="pkfilter" data-v="${k}" aria-pressed="${peakFilter===k}">${l}</button>`).join('')}</div>
      <div class="chips">${[['route','依路線'],['rank','依排名']].map(([k,l])=>`<button class="chip" data-act="pkgroup" data-v="${k}" aria-pressed="${peakGroup===k}">${l}</button>`).join('')}</div>
    </div>
    ${show.length?body:`<p class="empty">${peakFilter==='done'?'還沒有登頂紀錄。點任一座山可以補登以前的紀錄。':'全部完成，恭喜！'}</p>`}
    ${extra.size?`<h3 class="sec">標了「百岳」但名稱對不上名單</h3><ul class="notes">${[...extra.entries()].map(([n,r])=>`<li><b>${esc(n)}</b>｜${esc(r[0].trip.name)}，${fmtDate(r[0].ts)}<br><span class="hint">請把站名改成名單上的名稱（例如「奇萊主山北峰」改「奇萊北峰」也可以），才會計入。</span></li>`).join('')}</ul>`:''}
    <p class="hint" style="margin-top:12px">站名與百岳相同時會自動列入，也可以點任一座山補登以前的紀錄。</p>`;
}
function openPeak(rank){
  const p=PEAKS.find(x=>x[0]===rank);const c=peakClimbs().m.get(rank);
  openSheet(`<h2>${p[0]}. ${p[1]}</h2><p class="hint">${p[2]} m｜${p[3]}${PEAK_ALIAS[p[1]]?'｜也稱 '+PEAK_ALIAS[p[1]].join('、'):''}</p>
    ${c.length?`<ul class="notes">${c.map(r=>r.manual?`<li><b class="num">${fmtDate(r.ts)}</b>｜補登${r.manual.note?'｜'+esc(r.manual.note):''}
        <div class="row2" style="margin-top:8px"><button class="ghost danger" data-act="delmanual" data-id="${r.manual.id}">刪除這筆補登</button></div></li>`
      :`<li><b class="num">${fmtTime(r.ts)}　${fmtDate(r.ts)}</b><br>${esc(r.trip.name)}${r.station.alt!=null?'｜'+r.station.alt+' m':''}
        <div class="row2" style="margin-top:8px"><button class="ghost" data-act="gotrip" data-id="${r.trip.id}">看行程</button><button class="ghost" data-act="gotripreport" data-id="${r.trip.id}">看報告</button></div></li>`).join('')}</ul>`
      :'<p class="hint">還沒有登頂紀錄。</p>'}
    <div class="field"><label for="f-pdate">補登日期（以前去過、當時沒用 App）</label><input type="date" id="f-pdate"></div>
    <div class="field"><label for="f-pnote">備註</label><input id="f-pnote" placeholder="例：南二段第三天" autocomplete="off"></div>
    <div class="row2"><button class="ghost" data-act="closesheet-btn">關閉</button><button class="primary" data-act="addmanual" data-rank="${rank}">補登</button></div>`);
}
function addManual(rank){
  const v=$('#f-pdate').value;if(!v){showToast('請先選日期');return}
  const [y,mo,d]=v.split('-').map(Number);
  db.peaksManual.push({id:uid(),rank,ts:new Date(y,mo-1,d,12).getTime(),note:$('#f-pnote').value.trim()});
  save();closeSheet();const yy=window.scrollY;renderStats();window.scrollTo(0,yy);showToast('已補登');
}
function rerenderStats(){const y=window.scrollY;renderStats();window.scrollTo(0,y)}

/* ---------- export / backup ---------- */
function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function tripRows(t){
  const c=calc(t,Date.now());
  const L=[['序','地點','抵達','離開','休息(分)','前段行走(分)','累積經過(分)','海拔(m)','緯度','經度','天氣','隊員體力','標記','備註']];
  t.stations.forEach((s,i)=>{const r=c.rows[i];L.push([i+1,s.name,fmtFull(s.arr),fmtFull(s.dep),r.ongoing?'':mins(r.rest),mins(r.leg),mins(r.cum),s.alt??'',s.lat??'',s.lon??'',s.weather||'',s.team||'',(s.tags||[]).join('、'),s.note])});
  if(t.marks.length){L.push([]);L.push(['標記','類型','時間','','','','','海拔(m)','緯度','經度','','','','備註']);
    [...t.marks].sort((a,b)=>a.ts-b.ts).forEach((m,i)=>L.push(['M'+(i+1),m.tag,fmtFull(m.ts),'','','','',m.alt??'',m.lat??'',m.lon??'','','','',m.note]))}
  L.push([]);L.push(['行程',t.name]);L.push(['類型',t.type]);
  L.push(['累積經過',fmtDur(c.elapsed)]);L.push(['實際行走',fmtDur(c.walk)]);L.push(['累積休息',fmtDur(c.rest)]);
  if(c.hasAlt){L.push(['爬升(m)',c.up]);L.push(['下降(m)',c.down])}
  return L;
}
async function shareOrDownload(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const f=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);showToast('已產生 '+name+'；若沒有下載，請改用「複製」')}catch(e){showToast('無法下載，請改用「複製」')}
}
async function shareText(title,text){
  try{if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  copyText(text,'已複製報告，可貼到 LINE 或筆記');
}
async function copyText(text,okMsg){
  try{await navigator.clipboard.writeText(text);showToast(okMsg)}
  catch(e){openSheet(`<h2>手動複製</h2><p class="hint">長按下方文字全選後複製。</p><textarea id="f-copy" style="min-height:220px;width:100%;box-sizing:border-box;font-family:var(--mono);font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px">${esc(text)}</textarea><button class="primary" data-act="closesheet-btn">完成</button>`,
    el=>{const ta=el.querySelector('#f-copy');ta.focus();ta.select()})}
}
const safeName=s=>s.replace(/[\\/:*?"<>|]/g,'_');

/* ---------- toast ---------- */
function showToast(msg,actions=[]){
  clearTimeout(toastTimer);
  $('#toasthost').innerHTML=`<div class="toast" role="status"><p>${esc(msg)}</p>${actions.map((a,i)=>`<button data-toast="${i}">${esc(a.label)}</button>`).join('')}</div>`;
  $('#toasthost').onclick=e=>{const b=e.target.closest('[data-toast]');if(!b)return;const a=actions[+b.dataset.toast];$('#toasthost').innerHTML='';a&&a.fn()};
  toastTimer=setTimeout(()=>{$('#toasthost').innerHTML=''},actions.length?7000:2500);
}
function confirmTap(btn,key,label){
  if(armed===key){armed=null;return true}
  armed=key;btn.classList.add('armed');btn.textContent=label;
  setTimeout(()=>{if(armed===key){armed=null;btn.classList.remove('armed');btn.textContent=btn.dataset.orig}},4000);
  return false;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act;
  if(act==='closesheet'&&e.target!==el)return;
  if(act==='cmp')return;
  if(!el.dataset.orig)el.dataset.orig=el.textContent;
  switch(act){
    case 'newtrip':return openNewTrip();
    case 'createtrip':return createTrip();
    case 'open':return go({name:'trip',id:el.dataset.id});
    case 'back':return go({name:'list',id:null});
    case 'backtrip':return go({name:'trip',id:view.id});
    case 'stats':return go({name:'stats',id:null});
    case 'report':closeSheet();return go({name:'report',id:view.id});
    case 'display':return openDisplay();
    case 'setting':{const k=el.dataset.key;settings[k]=!settings[k];saveSettings();el.setAttribute('aria-pressed',settings[k]);el.textContent=settings[k]?'開':'關';
      if(k==='gps'&&settings.gps&&navigator.geolocation){try{navigator.geolocation.getCurrentPosition(()=>{},()=>{},{timeout:5000})}catch(err){}}return}
    case 'peak':return openPeak(+el.dataset.rank);
    case 'addmanual':return addManual(+el.dataset.rank);
    case 'delmanual':if(confirmTap(el,'delman','再按一次確認刪除')){db.peaksManual=db.peaksManual.filter(x=>x.id!==el.dataset.id);save();closeSheet();rerenderStats();showToast('已刪除補登')}return;
    case 'pkfilter':peakFilter=el.dataset.v;return rerenderStats();
    case 'pkgroup':peakGroup=el.dataset.v;return rerenderStats();
    case 'gotrip':closeSheet();return go({name:'trip',id:el.dataset.id});
    case 'gotripreport':closeSheet();return go({name:'report',id:el.dataset.id});
    case 'start':case 'arrive':case 'depart':return record(act);
    case 'markmenu':return openMarkMenu();
    case 'addmark':return addMark(el.dataset.tag);
    case 'editmark':return openMark(el.dataset.id);
    case 'savemark':return saveMark(el.dataset.id);
    case 'delmark':if(confirmTap(el,'delmark','再按一次確認刪除')){const t=trip();t.marks=t.marks.filter(m=>m.id!==el.dataset.id);save();closeSheet();render();showToast('已刪除標記')}return;
    case 'regeo':{const t=trip();showToast('定位中…');return grabGeo(t.id,el.dataset.kind,el.dataset.ref,false)}
    case 'endtrip':if(confirmTap(el,'end','再按一次確認結束'))endTrip();return;
    case 'reopen':{const t=trip();t.ended=null;save();closeSheet();go({name:'trip',id:t.id});return showToast('行程已重新開啟')}
    case 'edit':return openStation(+el.dataset.i);
    case 'savestation':return saveStation(+el.dataset.i);
    case 'delstation':if(confirmTap(el,'delst','再按一次確認刪除')){trip().stations.splice(+el.dataset.i,1);save();closeSheet();render();showToast('已刪除此站')}return;
    case 'quick':$('#f-sname').value=el.textContent;return;
    case 'setnow':$('#'+el.dataset.for).value=toInput(Date.now());return;
    case 'clear':$('#'+el.dataset.for).value='';return;
    case 'pick':{const box=el.parentNode;if(box.dataset.multi==='1'){el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')!=='true')}
      else{const was=el.getAttribute('aria-pressed')==='true';box.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
        if(!was||box.id==='typechips'||box.id==='mtag')el.setAttribute('aria-pressed','true')}return}
    case 'tripmenu':return openTripMenu();
    case 'savetrip':return saveTrip();
    case 'deltrip':if(confirmTap(el,'deltrip','再按一次確認刪除整個行程')){db.trips=db.trips.filter(x=>x.id!==view.id);save();closeSheet();go({name:'list',id:null});showToast('行程已刪除')}return;
    case 'sharereport':{const t=trip();return shareText(t.name,reportText(t))}
    case 'csvfile':{const t=trip();return shareOrDownload(safeName(t.name)+'.csv','﻿'+tripRows(t).map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv')}
    case 'csvcopy':{const t=trip();return copyText(tripRows(t).map(r=>r.join('\t')).join('\n'),'已複製，可直接貼到試算表')}
    case 'backup':{const d=new Date();return shareOrDownload('登山行程備份_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json',JSON.stringify(db,null,1),'application/json')}
    case 'restore':return $('#restorefile').click();
    case 'closesheet':case 'closesheet-btn':return closeSheet();
  }
});
document.addEventListener('change',e=>{if(e.target.id==='f-cmp'){cmpChoice[view.id]=e.target.value;const y=window.scrollY;renderReport();window.scrollTo(0,y)}});
$('#restorefile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.trips))throw 0;
    (d.peaksManual||[]).forEach(m=>{if(m&&m.id&&!db.peaksManual.some(x=>x.id===m.id))db.peaksManual.push(m)});
    let n=0;d.trips.forEach(t=>{if(!t.id||!Array.isArray(t.stations))return;const i=db.trips.findIndex(x=>x.id===t.id);i>=0?db.trips[i]=t:db.trips.push(t);n++});
    normalize();save();render();showToast('已還原 '+n+' 筆行程')}catch(err){showToast('這個檔案不是有效的行程備份')}
    e.target.value=''};
  rd.readAsText(f);
});

/* live clock + stats while a trip is running */
setInterval(()=>{
  if(view.name!=='trip')return; const t=trip(); if(!t||t.ended)return;
  const ck=$('#clock'); const d=new Date(); if(ck)ck.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  if(d.getSeconds()===0&&!$('#sheethost').innerHTML&&t.stations.length){const y=window.scrollY;renderTrip();window.scrollTo(0,y)}
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheethost').innerHTML){const y=window.scrollY;render();window.scrollTo(0,y)}});

try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

window.__hikelog={calc,fmtDur,legMap,compareCandidates,reportText,get db(){return db}};
render();
})();
</script>
